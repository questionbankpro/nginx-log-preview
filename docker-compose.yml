services:
  log-analyzer:
    build: .
    container_name: nginx_log_analyzer
    ports:
      - "3080:3000"
    volumes:
      # Option 1: Local logs directory mount (Read-Only)
      - ./logs:/logs:ro

      # Option 2: Direct Host / External Nginx Container Log Mount (Read-Only)
      # Uncomment the line below to inspect host or dockerized Nginx logs directly:
      # - /var/log/nginx:/logs:ro
      # - /var/lib/docker/containers:/var/lib/docker/containers:ro

      # Live code hot reloading
      - ./server.js:/app/server.js
      - ./models:/app/models
      - ./routes:/app/routes
      - ./public:/app/public
    environment:
      - PORT=3000
      - LOG_DIR=/logs
      # Enable watch mode for live production log file appending (native fs.watch / polling)
      - WATCH_LOGS=true
    restart: unless-stopped